name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build signed release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk PriceTracker-v0.1.${{ github.run_number }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: price-tracker-apk
          path: PriceTracker-v0.1.${{ github.run_number }}.apk
      # Every push becomes a GitHub Release. Install the newest APK over the old app: data is kept
      # because the signing key is fixed and versionCode rises with each run.
      - name: Publish release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v0.1.${{ github.run_number }}" PriceTracker-v0.1.${{ github.run_number }}.apk \
            --target "${{ github.sha }}" --prerelease \
            --title "Price Tracker v0.1.${{ github.run_number }}" \
            --notes "Install over the existing app to update. Your tracked items and history are kept."
